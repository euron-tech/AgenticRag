name: Deploy dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never interrupt a deployment mid-shift

permissions:
  contents: read
  id-token: write # required for OIDC; no AWS keys are stored in this repository

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Blue/green to dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # Until the deploy role exists, skip rather than fail. A permanently red
      # pipeline teaches people to ignore red pipelines.
      - name: Check the deploy role is configured
        id: cfg
        run: |
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo
              echo "\`AWS_DEPLOY_ROLE_ARN\` is not set in this repository."
              echo
              echo "Run \`python manage.py up --env dev\` locally, then add the"
              echo "\`github_deploy_role_arn\` output as that repository secret."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        if: steps.cfg.outputs.ready == 'true'
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false # manage.py parses terraform output

      - name: Assume the deploy role
        if: steps.cfg.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply infrastructure and push images
        if: steps.cfg.outputs.ready == 'true'
        run: python manage.py up --env dev --tag "${GITHUB_SHA::7}"
        env:
          TF_INPUT: "0"

      - name: Release
        if: steps.cfg.outputs.ready == 'true'
        # Smoke tests the test listener and only then shifts traffic.
        # A failed smoke test stops the deployment; blue keeps serving.
        run: python manage.py deploy --env dev --tag "${GITHUB_SHA::7}" --skip-build

      - name: Report
        if: always() && steps.cfg.outputs.ready == 'true'
        run: python manage.py status --env dev
