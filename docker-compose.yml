name: agentic-rag

services:
  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      APP_ENV: local
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ui:
    build:
      context: ./frontend
    env_file: .env
    environment:
      # Container-to-container, not localhost — the browser never calls the API.
      BACKEND_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
